version: 2

# Cooldown: Dependabot only proposes a release once it is 7 days old, so a
# hijacked or broken version has a week to be caught and pulled first.
# Security updates are exempt and still open as soon as a fix exists.
updates:
  # JavaScript/TypeScript dev dependencies (no runtime deps by design)
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # Batch minor/patch bumps to reduce PR noise; majors stay individual
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions used in .github/workflows/ (only ~2 actions today;
  # limit kept low to match the actual surface)
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
